<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콜라브레인 퍼스널 · 나의 상태</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --panel-2:#f7f8fa; --line:#e8eaee; --line-2:#f0f2f5;
    --text-hi:#1f2329; --text-mid:#5b6270; --text-low:#98a0ae;
    --blue:#3d6ef7; --blue-soft:#eaf0fe; --blue-dim:#c3d4fd;
    --green:#3fb98a; --green-soft:#e6f6ef;
    --yellow:#f0b429; --orange:#f5883c; --pink:#ef6b8a; --purple:#9b7ede;
    --red:#e5484d; --red-soft:#fdecec; --gray:#545a66;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text-hi);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    min-height:100vh;padding:28px 16px 72px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:660px;margin:0 auto;}

  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .logo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#5b8bff,#3d6ef7 55%,#7be0c4);}
  .wordmark{font-size:17px;font-weight:700;letter-spacing:-0.02em;}
  .daterange{font-size:12.5px;color:var(--text-low);}

  .nav{display:flex;gap:18px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-low);
    font-family:inherit;font-size:14.5px;padding:9px 1px 11px;cursor:pointer;transition:color .15s,border-color .15s;}
  .nav button:hover{color:var(--text-mid);}
  .nav button.active{color:var(--text-hi);border-bottom-color:var(--text-hi);font-weight:700;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 20px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card-title{font-size:15px;font-weight:700;margin:0 0 16px;display:flex;
    justify-content:space-between;align-items:center;gap:10px;}
  .card-note{font-size:11.5px;color:var(--text-low);line-height:1.65;margin-top:12px;}
  .chart-scroll{overflow-x:auto;}
  .subhead{font-size:12px;color:var(--text-low);font-weight:700;margin:0 0 6px;}
  .link{background:none;border:none;color:var(--blue);font-family:inherit;font-size:12.5px;
    font-weight:600;cursor:pointer;padding:0;}

  .empty{text-align:center;padding:56px 20px;color:var(--text-mid);background:var(--panel);
    border:1px dashed var(--line);border-radius:var(--radius);}
  .empty h2{font-size:19px;font-weight:700;color:var(--text-hi);margin:0 0 8px;}
  .empty p{font-size:14px;line-height:1.65;margin:0;}

  /* 아바타 */
  .avatar{position:relative;border-radius:24px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex-shrink:0;}
  .avatar-emoji{font-size:1em;line-height:1;}
  .avatar-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .a-lg{width:84px;height:84px;font-size:38px;border-radius:26px;}
  .a-md{width:56px;height:56px;font-size:26px;border-radius:18px;}
  .a-sm{width:38px;height:38px;font-size:18px;border-radius:13px;}

  .type-card{display:flex;align-items:center;gap:17px;}
  .type-code{font-size:11.5px;font-weight:800;letter-spacing:0.08em;color:var(--text-low);margin-bottom:3px;}
  .type-label{font-size:21px;font-weight:700;letter-spacing:-0.02em;margin:0 0 5px;}
  .type-sub{font-size:13.5px;color:var(--text-mid);line-height:1.6;margin:0;}
  .coverage{display:inline-block;margin-top:9px;font-size:11.5px;color:var(--text-mid);
    background:var(--panel-2);border:1px solid var(--line);padding:3px 9px;border-radius:20px;}
  .rep-row{display:flex;align-items:center;gap:12px;padding:12px 0 0;margin-top:14px;border-top:1px solid var(--line-2);}
  .rep-text{font-size:12.5px;color:var(--text-mid);line-height:1.6;}
  .rep-text b{color:var(--text-hi);}

  .hero-line{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;}
  .hero-num{font-size:36px;font-weight:800;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums;}
  .track{height:8px;background:var(--line-2);border-radius:6px;overflow:hidden;position:relative;}
  .fill{height:100%;border-radius:6px;background:var(--blue);}
  .bench-mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--text-low);border-radius:1px;}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:18px;}
  .tile{background:var(--panel);padding:13px 14px;}
  .tile-label{font-size:11.5px;color:var(--text-low);margin-bottom:5px;}
  .tile-value{font-size:14px;font-weight:700;line-height:1.35;}
  .tile-sub{font-size:12px;color:var(--text-mid);margin-top:2px;font-variant-numeric:tabular-nums;}

  .d{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
  .d-up{color:var(--blue);} .d-down{color:var(--red);} .d-flat{color:var(--text-low);}
  .d i{width:13px;height:13px;border-radius:50%;display:inline-flex;align-items:center;
    justify-content:center;font-size:9px;font-style:normal;color:#fff;}
  .d-up i{background:var(--blue);} .d-down i{background:var(--red);} .d-flat i{background:var(--text-low);}

  .score-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer;}
  .score-row:last-of-type{border-bottom:none;}
  .score-row:hover .score-name{color:var(--blue);}
  .score-name{flex:0 0 104px;font-size:13.5px;font-weight:600;transition:color .15s;}
  .score-num{flex:0 0 30px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;}
  .score-delta{flex:0 0 60px;text-align:right;}
  .score-chev{flex:0 0 8px;text-align:right;color:var(--text-low);font-size:13px;}
  .score-caveat{color:var(--text-low);font-weight:400;}

  .mix-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2);margin-bottom:13px;}
  .mix-seg{height:100%;}
  .mix-legend{display:flex;flex-wrap:wrap;gap:14px;}
  .mix-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-mid);}
  .mix-dot{width:8px;height:8px;border-radius:3px;}
  .mix-pct{color:var(--text-hi);font-weight:700;font-variant-numeric:tabular-nums;}

  .narrative{font-size:15.5px;line-height:1.7;margin:0;font-weight:500;}
  .why{font-size:13.5px;color:var(--text-mid);line-height:1.75;margin-top:9px;}
  .gap-note{font-size:13px;line-height:1.7;margin-top:12px;padding:12px 14px;background:var(--blue-soft);border-radius:10px;}

  .ins{display:flex;gap:9px;padding:9px 0;}
  .ins-icon{flex:0 0 15px;font-size:11px;line-height:1.7;}
  .ins-pos{color:var(--blue);} .ins-neg{color:var(--red);}
  .ins-text{font-size:13px;line-height:1.75;color:var(--text-mid);}

  .imp{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;}
  .imp:last-child{margin-bottom:0;}
  .imp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;
    background:var(--panel-2);border-bottom:1px solid var(--line);}
  .imp-rank{font-size:10.5px;font-weight:700;background:var(--blue-soft);color:var(--blue);padding:3px 8px;border-radius:6px;}
  .imp-metric{font-size:14px;font-weight:700;}
  .imp-block{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line-2);}
  .imp-block:first-of-type{border-top:none;}
  .imp-label{flex:0 0 58px;font-size:11.5px;color:var(--text-low);padding-top:2px;font-weight:700;}
  .imp-body{flex:1;font-size:12.5px;line-height:1.75;color:var(--text-mid);}
  .imp-body ul{margin:0;padding-left:15px;} .imp-body li{margin-bottom:2px;}
  .imp-more{background:none;border:none;color:var(--blue);font-size:12px;cursor:pointer;
    padding:0;font-family:inherit;margin-left:auto;font-weight:700;}

  .cmt{padding:14px 0;border-bottom:1px solid var(--line-2);}
  .cmt:first-of-type{padding-top:0;} .cmt:last-child{border-bottom:none;padding-bottom:0;}
  .cmt-head{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap;}
  .badge{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--panel-2);
    border:1px solid var(--line);color:var(--text-mid);font-weight:600;}
  .badge-exp{background:var(--blue-soft);border-color:var(--blue-dim);color:var(--blue);}
  .badge-promise{background:#fff4e3;border-color:#ffd9a0;color:#c47a12;}
  .badge-due{background:var(--red-soft);border-color:#f7c4c4;color:var(--red);}
  .badge-pos{background:var(--green-soft);border-color:#b9e6d1;color:#1e8f66;}
  .badge-neg{background:var(--red-soft);border-color:#f7c4c4;color:var(--red);}
  .cmt-title{font-size:15px;font-weight:700;margin:0 0 4px;}
  .cmt-desc{font-size:13.5px;color:var(--text-mid);line-height:1.7;margin:0 0 13px;}
  .cmt-status{font-size:12.5px;color:var(--text-mid);font-weight:600;}

  .btn{font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel);color:var(--text-hi);cursor:pointer;
    transition:background .15s,border-color .15s;}
  .btn:hover{background:var(--panel-2);border-color:#d6dae1;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .btn-primary:hover{background:#3260e0;border-color:#3260e0;}
  .btn-full{width:100%;} .btn-sm{font-size:12px;padding:6px 11px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .seg{display:flex;gap:5px;flex-wrap:wrap;}
  .seg button{font-size:12px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--text-mid);cursor:pointer;font-family:inherit;font-weight:600;}
  .seg button:hover{background:var(--panel-2);}
  .seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);}

  textarea{width:100%;min-height:140px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    color:var(--text-hi);font-family:inherit;font-size:13.5px;padding:13px;line-height:1.65;resize:vertical;margin-bottom:10px;}
  textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  input[type=text],input[type=password],select{width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;color:var(--text-hi);font-family:inherit;font-size:13.5px;padding:10px 12px;margin-bottom:13px;}
  input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  input[type=file]{width:100%;font-size:12.5px;color:var(--text-mid);margin-bottom:13px;}
  label{font-size:12.5px;color:var(--text-mid);display:block;margin-bottom:6px;font-weight:600;}
  .hint{font-size:11.5px;color:var(--text-low);line-height:1.65;margin:-7px 0 13px;}
  .block-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
    color:var(--text-mid);margin-bottom:7px;font-weight:600;}
  .block-head a{color:var(--red);cursor:pointer;font-size:12px;font-weight:500;}

  .stale-banner{font-size:12.5px;color:var(--text-mid);text-align:center;padding:10px;
    background:#fff8e8;border:1px solid #ffe2ab;border-radius:10px;margin-bottom:14px;}
  .trophy-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;
    background:linear-gradient(120deg,#fff6e0,#f0f5ff);border:1px solid #ffe2ab;margin-bottom:14px;}
  .trophy-banner .tb-emojis{font-size:22px;letter-spacing:-2px;}
  .trophy-banner .tb-text{flex:1;font-size:13px;line-height:1.6;}
  .trophy-banner b{font-weight:700;}

  .footer-note{text-align:center;font-size:12px;color:var(--text-low);margin-top:22px;line-height:1.7;}
  .danger{color:var(--red)!important;}
  .loading{display:flex;align-items:center;gap:10px;color:var(--text-mid);font-size:13px;padding:14px 0;}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--blue);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{background:var(--red-soft);border:1px solid #f7c4c4;color:#b5292e;padding:11px 13px;
    border-radius:9px;font-size:12.5px;margin-bottom:13px;line-height:1.65;}

  .clg{padding:15px 0;border-bottom:1px solid var(--line-2);}
  .clg:last-child{border-bottom:none;padding-bottom:0;}
  .clg-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .clg-name{font-size:15px;font-weight:700;}
  .clg-meta{font-size:12px;color:var(--text-low);}
  .clg-pattern{font-size:13px;color:var(--text-mid);line-height:1.75;padding-left:13px;position:relative;}
  .clg-pattern::before{content:'·';position:absolute;left:4px;color:var(--text-low);}

  .hist{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line-2);}
  .hist:last-child{border-bottom:none;}
  .hist-date{flex:0 0 112px;font-size:12.5px;color:var(--text-mid);font-variant-numeric:tabular-nums;}
  .hist-type{flex:1;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .hist-score{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 28px;text-align:right;}

  /* 도감 */
  .dex{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .dex-cell{border:1px solid var(--line);border-radius:12px;padding:11px 7px 10px;text-align:center;
    background:var(--panel);cursor:pointer;transition:border-color .15s,transform .1s;}
  .dex-cell:hover{border-color:var(--blue);transform:translateY(-1px);}
  .dex-cell.locked{background:var(--panel-2);cursor:default;opacity:0.72;}
  .dex-cell.locked:hover{border-color:var(--line);transform:none;}
  .dex-name{font-size:11px;font-weight:700;margin-top:7px;line-height:1.35;}
  .dex-code{font-size:9.5px;color:var(--text-low);font-weight:700;letter-spacing:0.06em;margin-top:2px;}
  .dex-cell .avatar{margin:0 auto;}
  .dex-lock{width:38px;height:38px;border-radius:13px;background:var(--line-2);margin:0 auto;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-low);}
  .dex-progress{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .dex-progress .track{flex:1;}

  /* 트로피 */
  .trophy{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-2);}
  .trophy:last-child{border-bottom:none;}
  .trophy.locked{opacity:0.45;}
  .tr-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:21px;background:linear-gradient(135deg,#fff2d4,#ffe0a6);flex-shrink:0;}
  .trophy.locked .tr-icon{background:var(--line-2);}
  .tr-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tr-desc{font-size:12px;color:var(--text-mid);margin-top:2px;line-height:1.55;}
  .tr-when{font-size:11.5px;color:var(--text-low);margin-top:3px;font-variant-numeric:tabular-nums;}
  .tag-retro{font-size:10px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);
    color:var(--text-low);padding:2px 6px;border-radius:5px;}
  .tag-new{font-size:10px;font-weight:700;background:var(--blue);color:#fff;padding:2px 6px;border-radius:5px;}

  /* 소개 */
  .intro-hero{text-align:center;padding:8px 0 4px;}
  .intro-hero h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin:0 0 10px;line-height:1.35;}
  .intro-hero p{font-size:14px;color:var(--text-mid);line-height:1.75;margin:0;}
  .intro-step{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line-2);}
  .intro-step:last-of-type{border-bottom:none;}
  .intro-num{flex:0 0 26px;height:26px;border-radius:9px;background:var(--blue-soft);color:var(--blue);
    font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .intro-t{font-size:14px;font-weight:700;margin-bottom:4px;}
  .intro-d{font-size:13px;color:var(--text-mid);line-height:1.7;}
  .dots{display:flex;gap:6px;justify-content:center;margin:18px 0 4px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .dot.on{background:var(--blue);width:18px;border-radius:3px;}

  .back{background:none;border:none;color:var(--text-mid);font-family:inherit;font-size:13px;
    cursor:pointer;padding:0 0 13px;font-weight:600;}
  .back:hover{color:var(--text-hi);}
  .metric-hero{display:flex;align-items:baseline;gap:12px;margin-bottom:7px;}
  .metric-hero h2{font-size:21px;font-weight:700;margin:0;letter-spacing:-0.02em;}
  .metric-hero .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto;letter-spacing:-0.03em;}
  .metric-def{font-size:13px;color:var(--text-mid);line-height:1.7;margin:0;}
  .formula{font-size:12.5px;color:var(--blue);background:var(--blue-soft);border-radius:9px;
    padding:10px 12px;line-height:1.6;margin-top:13px;font-weight:600;}
  .comp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2);}
  .comp-row:last-child{border-bottom:none;}
  .comp-name{flex:0 0 124px;font-size:12.5px;font-weight:600;}
  .comp-weight{flex:0 0 32px;font-size:11.5px;color:var(--text-low);text-align:right;}
  .comp-num{flex:0 0 28px;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}

  .ev{padding:14px 0;border-bottom:1px solid var(--line-2);}
  .ev:last-child{border-bottom:none;padding-bottom:0;}
  .ev-head{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap;}
  .ev-when{font-size:11.5px;color:var(--text-low);font-variant-numeric:tabular-nums;}
  .msg{padding:8px 11px;border-radius:9px;background:var(--panel-2);margin-bottom:5px;border-left:3px solid var(--line);}
  .msg.reply{margin-left:18px;}
  .msg.pos{border-left-color:var(--green);} .msg.neg{border-left-color:var(--red);}
  .msg-meta{font-size:11.5px;color:var(--text-low);margin-bottom:3px;font-variant-numeric:tabular-nums;font-weight:600;}
  .msg-text{font-size:13px;line-height:1.65;}
  .ev-note{font-size:12.5px;color:var(--text-mid);line-height:1.7;margin-top:8px;}

  .modal-bg{position:fixed;inset:0;background:rgba(31,35,41,0.42);display:flex;align-items:flex-start;
    justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--panel);border-radius:16px;max-width:560px;width:100%;padding:22px 20px;
    box-shadow:0 20px 48px rgba(16,24,40,0.18);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:6px;}
  .modal-head h3{font-size:19px;font-weight:700;margin:0;}
  .modal-close{background:none;border:none;color:var(--text-low);font-size:22px;cursor:pointer;line-height:1;padding:0;}
  .modal-sub{font-size:12.5px;color:var(--text-mid);line-height:1.7;margin-bottom:16px;
    padding-bottom:14px;border-bottom:1px solid var(--line);}

  /* 홈에 얹는 추가 기능 카드 (부가 인사이트류) */
  .soon-head{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap;}
  .soon-card .card-title{margin-bottom:6px;}
  .soon-why{font-size:12px;color:var(--text-low);line-height:1.65;margin:0 0 14px;}

<script>
/* ============================================================
   상수
   ============================================================ */

const MODEL = "claude-sonnet-5";
const KEY_ENTRIES="collabrain_entries", KEY_COMMITMENTS="collabrain_commitments",
      KEY_COLLEAGUES="collabrain_colleagues", KEY_SETTINGS="collabrain_settings",
      KEY_TROPHIES="collabrain_trophies", KEY_CAREER_DOCS="collabrain_career_docs",
      KEY_CAREER_MATERIALS="collabrain_career_materials";

const METRICS = {
  digitalization:{ label:"디지털화지수", color:"#3d6ef7",
    def:"디지털 협업도구(Slack·Jira 등) 활용 커뮤니케이션 지수",
    formula:"메시지수 40% + 메시지량 40% + 스레드 내 대화률 20%",
    parts:[["메시지수",40],["메시지량",40],["스레드 내 대화률",20]] },
  responsiveness:{ label:"응답 적시성", color:"#3fb98a",
    def:"업무 요청·피드백에 대한 응답 여부 및 속도",
    formula:"평균 응답시간 50% + 응답률(단독 멘션) 30% + 응답률(멀티 멘션) 20%",
    parts:[["평균 응답시간",50],["응답률(단독 멘션)",30],["응답률(멀티 멘션)",20]] },
  clarity:{ label:"의사전달 명확성", color:"#f0b429",
    def:"업무 요청에 핵심내용 포함 여부 및 양식 적합성",
    formula:"핵심정보 포함률 50% + 작성 양식 적합성 50%",
    parts:[["핵심정보 포함률",50],["작성 양식 적합성",50]] },
  initiative:{ label:"적극성", color:"#ef6b8a",
    def:"이슈·문제사항에 대한 의견 발언 및 책임감",
    formula:"의견 발언률 50% + 의견 주도성 50%",
    parts:[["의견 발언률",50],["의견 주도성",50]] },
  kindness:{ label:"친절도", color:"#f5883c",
    def:"작성한 메시지 톤 유형(공격적·사무적·비꼬임 등)",
    formula:"메시지톤 80% + 이모지 포함률 20%",
    parts:[["메시지톤",80],["이모지 포함률",20]] }
};
const METRIC_KEYS = Object.keys(METRICS);
const COMPOSITE_COLOR = "#545a66", BENCH_COLOR = "#b6bcc7";

/* 도메인(주제) 대신 행위(그 메시지에서 뭘 했는가) 기준 4분류.
   같은 주제를 얘기해도 조율만 했는지, 문제를 먼저 짚었는지, 결과물을 냈는지가 다르다. */
const WORK_MODES = ["진행관리","문제 제기","명확화","실행·전달"];
const MODE_DESC = {
  "진행관리": "일정·담당자·진행상황을 확인하고 조율함",
  "문제 제기": "남이 짚기 전에 리스크·예외를 먼저 꺼냄",
  "명확화": "모호한 요청을 질문으로 구체화함",
  "실행·전달": "결과물이나 결정을 만들어 공유함"
};
const MODE_COLORS = {"진행관리":"#3d6ef7","문제 제기":"#ef6b8a","명확화":"#f0b429","실행·전달":"#3fb98a"};
const MODE_CODE = {"진행관리":"C","문제 제기":"I","명확화":"L","실행·전달":"D"};

/* 설정에서 고르는 직함 — 동료 벤치마크를 추정할 때만 쓰인다(업무 행위 분류와는 별개). */
const JOB_ROLES = ["개발","기획","디자인","PM"];
const DAYS = ["월","화","수","목","금","토","일"];

/* 16유형 = 4분면(부하×점수) × 4업무도메인 */
const QUADRANTS = {
  "히어로":     { code:"H", grad:"linear-gradient(135deg,#ffd89b,#f5a623)", desc:"업무량도 많고 협업 점수도 높은 상태" },
  "하드 워커":   { code:"W", grad:"linear-gradient(135deg,#ffb3a7,#ef6b8a)", desc:"업무량은 많은데 점수는 보통인 상태" },
  "스마트 워커": { code:"S", grad:"linear-gradient(135deg,#9fc4ff,#3d6ef7)", desc:"업무량은 적은데 점수는 높은 상태" },
  "협업 단절":   { code:"Q", grad:"linear-gradient(135deg,#cfd4dd,#98a0ae)", desc:"업무량도 상호작용도 적은 상태" }
};
const QUAD_BY_CODE = Object.fromEntries(Object.entries(QUADRANTS).map(([k,v])=>[v.code,k]));

/* 4분면(H/W/S/Q) × 주력 행위(C진행관리/I문제제기/L명확화/D실행전달) = 16유형 */
const TYPES = {
  HC:{e:"🎖",n:"판 돌리는 사령관",    l:"많이 주고받으면서 일정과 담당을 계속 맞춥니다."},
  HI:{e:"🔥",n:"먼저 불 보는 사람",   l:"바쁜 와중에도 문제를 먼저 짚어냅니다."},
  HL:{e:"🔍",n:"캐묻는 사람",         l:"바쁜 와중에도 애매한 건 짚고 넘어갑니다."},
  HD:{e:"⚡",n:"질주하는 빌더",       l:"많이 치고 많이 만들어냅니다."},
  WC:{e:"📮",n:"무한 중계기",         l:"메시지가 나를 거쳐 계속 흘러갑니다."},
  WI:{e:"🚨",n:"경보기",              l:"일은 많은데 문제부터 눈에 띕니다."},
  WL:{e:"❓",n:"되묻는 사람",         l:"일이 많다 보니 확인부터 하고 넘어갑니다."},
  WD:{e:"🔨",n:"묵묵한 대장장이",     l:"손이 많이 가는데 티가 덜 나는 편입니다."},
  SC:{e:"♟",n:"조용한 조율가",       l:"나서지 않는데 정리가 됩니다."},
  SI:{e:"🔎",n:"정확히 짚는 사람",   l:"말은 적어도 짚을 건 짚습니다."},
  SL:{e:"🧭",n:"질문으로 트는 사람", l:"몇 마디 질문으로 방향이 잡힙니다."},
  SD:{e:"🎯",n:"한 방의 저격수",     l:"적게 말하고 정확히 꽂습니다."},
  QC:{e:"📡",n:"원격 관제사",         l:"멀찍이서 상황을 지켜보는 중입니다."},
  QI:{e:"🔦",n:"혼자 살피는 사람",   l:"가끔 나서는 말이 대개 문제 제기입니다."},
  QL:{e:"🌀",n:"혼잣말로 정리하는 사람", l:"묻는 말이 대부분 확인하는 질문입니다."},
  QD:{e:"🕳",n:"동굴 속 장인",       l:"깊게 파고 혼자 완성합니다."}
};
const TYPE_CODES = Object.keys(TYPES);

const BENCH_DISCLAIMER = "동료 평균은 아직 진짜 데이터가 아닙니다. 비슷한 직무면 보통 이 정도라고 AI가 잡아둔 <strong>참고선</strong>이에요. 쓰는 사람이 쌓이면 실제 값으로 바꿉니다.";

/* ============================================================
   저장소 · 유틸
   ============================================================ */

/* Chrome은 file://로 연 페이지에서 localStorage를 막는다(SecurityError).
   그럴 땐 메모리에 담아 이번 세션만이라도 정상 동작하게 하고, 화면에 알린다. */
let storageOK = true, memStore = {};
try {
  const probe = "__collabrain_probe__";
  localStorage.setItem(probe, "1"); localStorage.removeItem(probe);
} catch(e){ storageOK = false; }

function load(k,f){
  try{
    const r = storageOK ? localStorage.getItem(k) : (memStore[k] ?? null);
    return r ? JSON.parse(r) : f;
  }catch(e){ return f; }
}
function save(k,v){
  const s = JSON.stringify(v);
  try{
    if(storageOK) localStorage.setItem(k, s); else memStore[k] = s;
  }catch(e){ storageOK = false; memStore[k] = s; }
}

// 기록 순서는 "분석한 순서"가 아니라 "대화가 담고 있는 기간" 기준이다.
const entryTime = e => new Date(e.periodEnd || e.date).getTime();
const getEntries=()=>load(KEY_ENTRIES,[]).slice().sort((a,b)=>entryTime(a)-entryTime(b));
const getCommitments=()=>load(KEY_COMMITMENTS,[]);
const getColleagues=()=>load(KEY_COLLEAGUES,[]);
const getSettings=()=>load(KEY_SETTINGS,{apiKey:"",selfName:"",jobRole:"",careerGoal:"",onboarded:false});
const getTrophyStore=()=>load(KEY_TROPHIES,{earned:[],initialized:false});
const getCareerDocs=()=>load(KEY_CAREER_DOCS,[]);
const getCareerMaterials=()=>load(KEY_CAREER_MATERIALS,[]);
const setEntries=v=>save(KEY_ENTRIES,v), setCommitments=v=>save(KEY_COMMITMENTS,v),
      setColleagues=v=>save(KEY_COLLEAGUES,v), setSettings=v=>save(KEY_SETTINGS,v),
      setTrophyStore=v=>save(KEY_TROPHIES,v), setCareerDocs=v=>save(KEY_CAREER_DOCS,v),
      setCareerMaterials=v=>save(KEY_CAREER_MATERIALS,v);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
const fmtTick=d=>new Date(d).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});
const daysAgo=s=>Math.floor((Date.now()-new Date(s).getTime())/86400000);
const daysUntil=s=>Math.ceil((new Date(s).getTime()-Date.now())/86400000);
const avgScore=sc=>Math.round(METRIC_KEYS.map(k=>sc?.[k]??0).reduce((a,b)=>a+b,0)/METRIC_KEYS.length);

function entryLabel(e){
  if(e.periodLabel) return e.periodLabel;
  if(e.periodStart&&e.periodEnd) return `${fmtTick(e.periodStart)} ~ ${fmtTick(e.periodEnd)}`;
  if(e.periodEnd) return fmtTick(e.periodEnd);
  return `${fmtTick(e.date)} 분석`;
}
const entryTick=e=>e.periodEnd?fmtTick(e.periodEnd):fmtTick(e.date);

function coverage(entries){
  const wp=entries.filter(e=>e.periodStart&&e.periodEnd);
  if(!wp.length) return `${entries.length}개 기간 기록`;
  const s=new Date(Math.min(...wp.map(e=>+new Date(e.periodStart))));
  const t=new Date(Math.max(...wp.map(e=>+new Date(e.periodEnd))));
  const days=Math.round((t-s)/86400000)+1;
  return `${fmtTick(s)} ~ ${fmtTick(t)} · ${days>=14?`약 ${Math.round(days/7)}주`:`${days}일`} 관찰`;
}

function deltaBadge(cur,prev){
  if(prev===undefined||prev===null) return `<span class="d d-flat">신규</span>`;
  const d=cur-prev;
  if(d>0) return `<span class="d d-up"><i>↑</i>+${d}점</span>`;
  if(d<0) return `<span class="d d-down"><i>↓</i>${d}점</span>`;
  return `<span class="d d-flat">변동없음</span>`;
}

/* 유형 코드 — 4분면 + 가장 많이 한 행위에서 파생 */
function leadMode(mix){
  if(!mix) return null;
  return WORK_MODES.reduce((a,b)=>(mix[b]||0)>(mix[a]||0)?b:a, WORK_MODES[0]);
}
function typeCode(e){
  const q=QUADRANTS[e.type]?.code, d=MODE_CODE[leadMode(e.workMode)];
  return (q&&d)?q+d:null;
}
/* 대표 유형 — 최근 3기간 최빈값 (동률이면 더 최근 것) */
function representativeType(entries){
  const recent=entries.slice(-3).map(typeCode).filter(Boolean);
  if(!recent.length) return null;
  const count={};
  recent.forEach((c,i)=>{ count[c]=(count[c]||0)+1+i*0.01; });
  return Object.keys(count).reduce((a,b)=>count[b]>count[a]?b:a);
}
function avatarHTML(code, sizeClass){
  const t=TYPES[code]; if(!t) return "";
  const grad=QUADRANTS[QUAD_BY_CODE[code[0]]]?.grad||"var(--line-2)";
  // 이미지가 있으면 이미지, 없으면 이모지로 폴백한다.
  return `<div class="avatar ${sizeClass}" style="background:${grad}">
    <span class="avatar-emoji">${t.e}</span>
    <img class="avatar-img" src="assets/types/${code}.png" alt=""
         onerror="this.remove()"
         onload="this.previousElementSibling.style.display='none'">
  </div>`;
}

/* ============================================================
   트로피 — 저장된 데이터만으로 판정 가능한 규칙
   ============================================================ */

const TROPHY_RULES = [
  { id:"first-mirror", e:"🪞", n:"첫 거울", d:"처음으로 나를 들여다봤습니다.",
    per:(e,i)=>i===0 },
  { id:"steady-3", e:"📖", n:"세 번째 기록", d:"세 기간을 모았습니다. 이제 추이가 보입니다.",
    per:(e,i)=>i===2 },
  { id:"steady-6", e:"📚", n:"습관이 됐다", d:"여섯 기간을 모았습니다.",
    per:(e,i)=>i===5 },
  { id:"growth-spurt", e:"📈", n:"눈에 띄게 좋아짐", d:"한 축이 지난 기간보다 10점 넘게 올랐습니다.",
    per:(e,i,prev)=>!!prev && METRIC_KEYS.some(k=>(e.scores?.[k]??0)-(prev.scores?.[k]??0)>=10) },
  { id:"all-rounder", e:"⭐", n:"빈틈없음", d:"다섯 축 전부 70점을 넘겼습니다.",
    per:e=>METRIC_KEYS.every(k=>(e.scores?.[k]??0)>=70) },
  { id:"night-clear", e:"🌙", n:"칼퇴의 정석", d:"밤 10시 이후 보낸 메시지 0건.",
    per:e=>e.hasTimestamps && (e.activity||[]).length>0 &&
           !(e.activity||[]).some(a=>(a.hour>=22||a.hour<7)&&a.count>0) },
  { id:"ahead", e:"🚀", n:"평균 위에서", d:"동료 평균을 세 축에서 넘었습니다.",
    per:e=>!!e.benchmark && METRIC_KEYS.filter(k=>(e.scores?.[k]??0)>(e.benchmark[k]??0)).length>=3 },
  { id:"collector-5",  e:"🗺", n:"유형 수집가",   d:"서로 다른 유형 5가지를 만났습니다.",  dex:5 },
  { id:"collector-10", e:"🧭", n:"베테랑 수집가", d:"서로 다른 유형 10가지를 만났습니다.", dex:10 },
  { id:"collector-16", e:"👑", n:"도감 완성",     d:"16가지를 전부 만났습니다. 대단하네요.", dex:16 },
  { id:"promise-keeper", e:"🤝", n:"말한 대로", d:"동료에게 한 약속을 지켰습니다.",
    cmt:c=>c.source==="self_promise" && c.status==="done" },
  { id:"experimenter", e:"🧪", n:"일단 해봄", d:"제안받은 걸 실제로 해봤습니다.",
    cmt:c=>c.source==="system_experiment" && c.status==="done" }
];

/* 매번 전체를 재평가한다. 이미 획득한 것은 유지, 신규만 추가.
   규칙을 나중에 추가해도 과거 기록까지 자동 반영된다. */
function evaluateTrophies(){
  const store=getTrophyStore();
  const first=!store.initialized;
  const have=new Set(store.earned.map(t=>t.id));
  const entries=getEntries(), cms=getCommitments();
  const fresh=[];

  const award=(rule, when, where)=>{
    if(have.has(rule.id)) return;
    have.add(rule.id);
    const t={ id:rule.id, earnedAt:when||new Date().toISOString(), where:where||"",
              retro:first, seen:first };
    store.earned.push(t);
    if(!first) fresh.push(rule);
  };

  const seenCodes=new Set();
  entries.forEach((e,i)=>{
    const when=e.periodEnd||e.date, where=entryLabel(e), prev=i>0?entries[i-1]:null;
    const c=typeCode(e); if(c) seenCodes.add(c);
    for(const r of TROPHY_RULES){
      if(r.per && r.per(e,i,prev)) award(r,when,where);
      if(r.dex && seenCodes.size>=r.dex) award(r,when,where);
    }
  });
  for(const r of TROPHY_RULES){
    if(!r.cmt) continue;
    const hit=cms.find(r.cmt);
    if(hit) award(r, hit.completedAt||hit.createdAt, hit.title);
  }

  store.initialized=true;
  setTrophyStore(store);
  return fresh;
}
const unseenTrophies=()=>getTrophyStore().earned.filter(t=>!t.seen);
function markTrophiesSeen(){
  const s=getTrophyStore(); s.earned.forEach(t=>t.seen=true); setTrophyStore(s); render();
}

/* ============================================================
   차트
   ============================================================ */

function sparkline(entries){
  const W=620,H=88,P={l:8,r:8,t:12,b:16};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, n=entries.length;
  const vals=entries.map(e=>avgScore(e.scores));
  // 0~100 고정이면 점수가 높을 때 선이 위쪽에 붙어버려서, 데이터 범위에 맞춰 늘린다.
  const lo=Math.max(0, Math.min(...vals)-6), hi=Math.min(100, Math.max(...vals)+6);
  const span=Math.max(hi-lo, 10);
  const x=i=>P.l+(n===1?iw/2:i*iw/(n-1));
  const y=v=>P.t+ih-(clamp(v,lo,hi)-lo)/span*ih;
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?4.5:3}"
    fill="${i===n-1?"#3d6ef7":"#c3d4fd"}"><title>${entryLabel(entries[i])} · ${v}점</title></circle>`).join("");
  // 점수 차이가 작으면 선이 거의 평평해 보이는데, 호버 툴팁만으론 숫자를 알 수 없다
  // (터치 기기에선 호버 자체가 없다). 그래서 점 옆에 숫자를 항상 보이게 적어둔다.
  const labels=vals.map((v,i)=>`<text x="${x(i)}" y="${y(v)-9}" text-anchor="middle" class="axis-label"
    style="${i===n-1?"font-weight:700;fill:#3d6ef7;font-size:11px":""}">${v}</text>`).join("");
  return `<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">
    ${n>1?`<polyline points="${pts}" fill="none" stroke="#3d6ef7" stroke-width="2" stroke-linejoin="round"/>`:""}${dots}${labels}
    <text x="${P.l}" y="${H-3}" class="axis-label">${entryTick(entries[0])}</text>
    ${n>1?`<text x="${W-P.r}" y="${H-3}" text-anchor="end" class="axis-label">${entryTick(entries[n-1])}</text>`:""}
  </svg></div>`;
}

function multiTrendChart(entries, hidden){
  const W=620,H=260,P={l:32,r:14,t:16,b:30};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, n=entries.length;
  const x=i=>P.l+(n===1?iw/2:i*iw/(n-1));
  const y=v=>P.t+ih-clamp(v,0,100)/100*ih;
  const grid=[0,20,40,60,80,100].map(v=>
    `<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" class="grid-line"/>
     <text x="${P.l-6}" y="${y(v)+3}" text-anchor="end" class="axis-label">${v}</text>`).join("");
  const series=[{key:"composite",label:"종합",color:COMPOSITE_COLOR,w:2.8},
    ...METRIC_KEYS.map(k=>({key:k,label:METRICS[k].label,color:METRICS[k].color,w:1.6}))];
  const lines=series.filter(s=>!hidden.includes(s.key)).map(s=>{
    const vals=entries.map(e=>s.key==="composite"?avgScore(e.scores):(e.scores?.[s.key]??0));
    const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${s.w>2?4:3}" fill="${s.color}"><title>${s.label} ${v}점</title></circle>`).join("");
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-linejoin="round"/>${dots}`;
  }).join("");
  const ticks=entries.map((e,i)=>`<text x="${x(i)}" y="${H-9}" text-anchor="middle" class="axis-label">${entryTick(e)}</text>`).join("");

    const off=hidden.includes(s.key);

      <i class="swatch" style="background:${s.color};height:${s.key==="composite"?4:3}px"></i>${s.label}</span>`;}).join("");
  return `<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">
    ${grid}${lines}${ticks}</svg></div><div class="legend">${legend}</div>
    <div class="card-note">${n===1?"기간이 하나라 아직 선이 없습니다. 하나만 더 넣으면 이어집니다."
      :"범례를 누르면 선이 켜지고 꺼집니다."}</div>`;

function radarChart(latest, prev, bench){
  const W=480,H=310,cx=W/2,cy=H/2+4,R=100,n=METRIC_KEYS.length;
  const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n, r=R*clamp(v,0,100)/100;
    return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  const poly=sc=>METRIC_KEYS.map((k,i)=>pt(i,sc?.[k]??0).join(",")).join(" ");
  const rings=[25,50,75,100].map(p=>`<polygon points="${METRIC_KEYS.map((k,i)=>pt(i,p).join(",")).join(" ")}" fill="none" class="grid-line"/>`).join("");
  const spokes=METRIC_KEYS.map((k,i)=>{const[x,y]=pt(i,100);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="grid-line"/>`;}).join("");
  const labels=METRIC_KEYS.map((k,i)=>{const[x,y]=pt(i,126);
    const anc=Math.abs(x-cx)<12?"middle":(x>cx?"start":"end");
    return `<text x="${x}" y="${y+3}" text-anchor="${anc}" class="axis-label">${METRICS[k].label}</text>`;}).join("");
  const benchPoly=bench?`<polygon points="${poly(bench)}" fill="none" stroke="${BENCH_COLOR}" stroke-width="1.6" stroke-dasharray="5 3"/>`:"";
  const prevPoly=prev?`<polygon points="${poly(prev.scores)}" fill="rgba(84,90,102,0.06)" stroke="#c7ccd4" stroke-width="1.4"/>`:"";
  const dots=METRIC_KEYS.map((k,i)=>{const[x,y]=pt(i,latest.scores?.[k]??0);return `<circle cx="${x}" cy="${y}" r="3.5" fill="#3d6ef7"/>`;}).join("");
  return `<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">
    ${rings}${spokes}${benchPoly}${prevPoly}
    <polygon points="${poly(latest.scores)}" fill="rgba(61,110,247,0.16)" stroke="#3d6ef7" stroke-width="2"/>
    ${dots}${labels}</svg></div>
    <div class="legend"><span><i class="swatch" style="background:#3d6ef7"></i>나</span>
    ${prev?`<span><i class="swatch" style="background:#c7ccd4"></i>지난 기간</span>`:""}
    ${bench?`<span><i class="swatch" style="background:${BENCH_COLOR}"></i>동료 평균(추정)</span>`:""}</div>`;
}

function componentBars(entries, key){
  const parts=METRICS[key].parts, cols=["#3d6ef7","#3fb98a","#f0b429"];
  const W=620,H=250,P={l:32,r:14,t:16,b:32};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, n=entries.length;
  const step=iw/n, gw=Math.min(step-16, 24*parts.length), bw=gw/parts.length-3;
  const y=v=>P.t+ih-clamp(v,0,100)/100*ih;
  const grid=[0,25,50,75,100].map(v=>
    `<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" class="grid-line"/>
     <text x="${P.l-6}" y="${y(v)+3}" text-anchor="end" class="axis-label">${v}</text>`).join("");
  const bars=entries.map((e,i)=>{
    const bd=e.scoreBreakdown?.[key], gx=P.l+step*i+step/2-gw/2;
    return parts.map((p,j)=>{
      const v=bd?.[j]?.value??0, bx=gx+j*(bw+3), by=y(v), bh=P.t+ih-by;
      return `<rect class="bar-hit" x="${bx}" y="${by}" width="${bw}" height="${Math.max(bh,1)}" rx="3"
        fill="${cols[j%cols.length]}" onclick="openCause('${key}',${i})"><title>${entryLabel(e)} · ${esc(p[0])} ${v}점</title></rect>`;
    }).join("")+`<text x="${gx+gw/2}" y="${H-10}" text-anchor="middle" class="axis-label">${entryTick(e)}</text>`;
  }).join("");
  const legend=parts.map((p,j)=>`<span><i class="swatch" style="background:${cols[j%cols.length]}"></i>${p[0]} <span style="color:var(--text-low)">${p[1]}%</span></span>`).join("");
  return `<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${grid}${bars}</svg></div>
    <div class="legend">${legend}</div><div class="card-note">막대를 눌러보세요. 그 기간의 대화가 나옵니다.</div>`;
}

function heatmap(activity, entryIdx){
  const cw=20,ch=20,g=3,L=28,T=18;
  const W=L+24*(cw+g), H=T+7*(ch+g)+6;
  const max=Math.max(1,...activity.map(a=>a.count||0));
  const cells=[];
  for(let d=0;d<7;d++) for(let h=0;h<24;h++){
    const a=activity.find(z=>z.day===DAYS[d]&&z.hour===h);
    const cnt=a?.count||0, t=cnt/max, night=(h>=22||h<7);
    const base=night?"239,107,138":"63,185,138";
    const fill=cnt===0?"#f2f4f7":`rgba(${base},${0.16+t*0.78})`;
    const tip=cnt===0?`${DAYS[d]} ${h}시 · 데이터 없음`
      :`${DAYS[d]} ${h}시 · 메시지 ${cnt}건${a.score!=null?` · 점수 ${a.score}`:""}`;
    cells.push(`<rect class="cell" x="${L+h*(cw+g)}" y="${T+d*(ch+g)}" width="${cw}" height="${ch}" rx="4" fill="${fill}"
      ${cnt?`onclick="openHourCause(${entryIdx},'${DAYS[d]}',${h})"`:""}><title>${tip}</title></rect>`);
  }
  const dayL=DAYS.map((d,i)=>`<text x="${L-6}" y="${T+i*(ch+g)+14}" text-anchor="end" class="axis-label">${d}</text>`).join("");
  const hourL=[0,3,6,9,12,15,18,21,23].map(h=>`<text x="${L+h*(cw+g)+cw/2}" y="${T-6}" text-anchor="middle" class="axis-label">${h}</text>`).join("");
  return `<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" width="${W}" style="min-width:${W}px">
    ${cells.join("")}${dayL}${hourL}</svg></div>
    <div class="legend"><span><i class="swatch" style="background:rgba(63,185,138,0.9)"></i>업무 시간</span>
      <span><i class="swatch" style="background:rgba(239,107,138,0.9)"></i>이른 아침·심야 (22~7시)</span></div>
    <div class="card-note">칸을 눌러보세요. 그때 무슨 대화였는지 나옵니다.</div>`;
}

function mixTrend(entries){
  const W=620,H=200,P={l:10,r:10,t:12,b:28};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, n=entries.length;
  const step=iw/n, bw=Math.min(52,step-14);
  const bars=entries.map((e,i)=>{
    const cx=P.l+step*i+step/2-bw/2; let acc=0;
    return WORK_MODES.map(m=>{
      const v=e.workMode?.[m]||0, h=ih*v/100, yy=P.t+ih-acc-h; acc+=h;
      return v>0?`<rect x="${cx}" y="${yy}" width="${bw}" height="${h}" fill="${MODE_COLORS[m]}"><title>${entryLabel(e)} · ${m} ${v}%</title></rect>`:"";
    }).join("")+`<text x="${cx+bw/2}" y="${H-9}" text-anchor="middle" class="axis-label">${entryTick(e)}</text>`;
  }).join("");
  return `<div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${bars}</svg></div>
    <div class="legend">${WORK_MODES.map(m=>`<span><i class="swatch" style="background:${MODE_COLORS[m]}"></i>${m}</span>`).join("")}</div>`;
}

function buildSystemPrompt(s){
  const role = s.jobRole ? `본인의 공식 직무는 "${s.jobRole}"입니다.` : `본인의 공식 직무는 입력되지 않았습니다.`;
  return `당신은 개인의 Slack 협업 데이터를 분석해 "나의 상태"를 알려주는 도구입니다.

입력된 대화에서 화자를 구분하세요. "${s.selfName}"로 표시된 발화가 본인입니다.
나머지 사람은 실명 그대로 유지하세요 (익명화하지 않음 — 본인만 보는 개인용 기록입니다).
${role}

## 0. 분석 기간 (period)
이 분석의 단위는 "분석을 실행한 시각"이 아니라 **대화가 실제로 담고 있는 기간**입니다.
대화의 날짜·타임스탬프에서 가장 이른 시점과 가장 늦은 시점을 찾아
periodStart / periodEnd를 ISO 날짜(YYYY-MM-DD)로 반환하세요. 연도가 없으면 올해로 간주합니다.
날짜를 전혀 알 수 없으면 세 필드 모두 빈 문자열. periodLabel은 사람이 읽는 형식("7월 27일 ~ 7월 31일").

## 1. 채점 (본인 발화 기준, 각 0~100)
구성요소를 각각 0~100으로 평가한 뒤 가중합하세요. 감으로 총점을 매기지 말고
scoreBreakdown에 구성요소 점수를 반드시 함께 반환하세요.

- digitalization = 메시지수 40% + 메시지량 40% + 스레드 내 대화률 20%
- responsiveness = 평균 응답시간 50% + 응답률(단독 멘션) 30% + 응답률(멀티 멘션) 20%
- clarity = 핵심정보 포함률 50% + 작성 양식 적합성 50%
- initiative = 의견 발언률 50% + 의견 주도성 50%
- kindness = 메시지톤 80% + 이모지 포함률 20%

scoreBreakdown의 항목 순서·이름·가중치는 위와 정확히 일치해야 하며,
scores 값은 그 구성요소들의 가중합과 일치해야 합니다.
기간 길이에 따라 절대량이 달라지므로 **기간 길이로 정규화**해서 채점하세요.
3일치와 2주치가 같은 잣대로 비교될 수 있어야 합니다.
타임스탬프가 없어 평균 응답시간을 계산할 수 없으면 hasTimestamps를 false로 하고
responsiveness는 응답률 항목만으로 100점 만점 환산하세요.

## 2. 동료 벤치마크 (benchmark)
같은 직무·비슷한 업무 성격의 지식노동자에게서 **일반적으로 관찰되는 수준**을
5개 지표 각각 0~100으로 추정하세요. 실제 집계 데이터가 아니라 추정 참고선입니다.
benchmarkBasis에 무엇을 근거로 추정했는지 1문장. 본인 점수를 베끼지 말고 독립적으로 제시하세요.

## 3. 근거 (evidence) — 6~12개
각 점수의 근거가 된 **실제 대화 원문**을 인용하세요. 이 앱의 핵심 기능입니다.
- metric / polarity(positive|negative)
- speaker, at, quote : 근거가 되는 본문 발화 (원문 그대로, 요약·각색 금지, 140자 이내)
- contextSpeaker, contextAt, contextQuote : 그 발화를 유발한 **선행 발화**(요청·질문).
  응답 적시성처럼 요청→응답 쌍이 있으면 반드시 채우세요. 없으면 세 필드 모두 빈 문자열.
- elapsed : 선행 발화와의 간격("39분","2시간 38분","무응답"). 없으면 빈 문자열.
- note : 왜 이 대화가 그 지표의 근거인지 1문장
- day / hour : 근거 발화의 요일("월"~"일")과 시(0~23). 타임스탬프 없으면 day는 빈 문자열, hour는 -1.
서로 다른 지표를 최소 3개 이상 다루세요.

## 4. 인사이트 (insights) — 4~6개
관찰된 사실을 한 문장씩. polarity(positive|negative)와 text. 숫자를 근거로 구체적으로.

## 5. 개선 제안 (improvements) — 1~3개
가장 낮거나 가장 크게 하락한 지표부터. metric / problem(한 문장) /
causes(원인 2~3개) / actions(개선방향 2~3개, 데이터로 관측 가능한 행동만).

## 6. 시간대별 활동 (activity) — 최대 40개
본인 발화를 요일×시간 버킷으로 집계. day, hour(0~23), count, score(0~100).
타임스탬프가 없으면 빈 배열.

## 7. 부하 (load, 0~100) = 직접 업무(발신량) + 읽기 업무(수신량). 기간 길이로 정규화.

## 8. 업무 유형 — "스마트 워커"(부하↓·점수↑) / "히어로"(부하↑·점수↑) /
   "하드 워커"(부하↑·점수 보통) / "협업 단절"(부하↓·상호작용 적음)

## 9. 업무 행위 구성 (workMode) — 합 100
본인 메시지가 **무슨 주제**였는지가 아니라 **그 메시지에서 무엇을 했는지**로 분류하세요.
같은 기획 얘기를 해도 조율만 했는지, 문제를 먼저 짚었는지가 다릅니다.
- 진행관리: 일정·담당자·진행상황을 확인하고 조율함 (예: "QA 인력은 누가 붙나요?")
- 문제 제기: 남이 짚기 전에 리스크·예외·이슈를 먼저 꺼냄 (예: "결과가 0건이면 어떻게 보여줄까요?")
- 명확화: 모호한 요청을 질문으로 구체화함 (예: "1000원 단위로 가면 될까요?")
- 실행·전달: 결과물이나 결정을 만들어 공유함 (예: "스펙 문서 v2 올렸습니다")

## 10. Commitment (최대 2개)
- "system_experiment": 데이터로 관측 가능한 행동 제안 1개 (마음가짐·태도 금지)
- "self_promise": 본인이 대화 중 실제로 한 약속. deadline은 ISO 날짜, 대상자는 relatedColleague
- scriptLine: 그 행동을 실제로 할 때 Slack에 그대로 복사해서 쓸 수 있는 한 문장 예시.
  "~하려고 노력하겠습니다" 같은 다짐문이 아니라 실제 발화 문장으로 ("이 부분이 걸리는 게 있는데, 확인 가능하실까요?").

## 11. 동료 관찰 (colleagues) — 동료별 서술형 관찰 1~2개. 점수 금지.

## 톤 원칙
사람을 진단·단정하지 말고 관찰된 패턴만 서술. 서열화 표현 금지.
narrative는 따뜻하고 관찰적인 1~2문장.
selfPerceptionNote는 본인 인식과 workMode의 차이를 1문장으로. 차이 없으면 빈 문자열.`;
}

async function postClaude(settings, system, userPrompt, schema, maxTokens){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":settings.apiKey,
      "anthropic-version":"2023-06-01",
      // 브라우저에서 api.anthropic.com을 직접 호출하기 위한 opt-in 헤더 (프록시 불필요)
      "anthropic-dangerous-direct-browser-access":"true" },
    body:JSON.stringify({ model:MODEL, max_tokens:maxTokens,
      output_config:{ effort:"medium", format:{ type:"json_schema", schema } },
      system, messages:[{ role:"user", content:userPrompt }] })
  });
  if(!res.ok){
    let detail=""; try{ detail=(await res.json()).error?.message||""; }catch(e){}
    if(res.status===401) throw new Error("API 키가 안 맞아요. 설정에서 다시 확인해주세요.");
    if(res.status===429) throw new Error("잠깐 몰렸네요. 조금 뒤에 다시 눌러주세요.");
    throw new Error(`API 오류 ${res.status}${detail?" · "+detail:""}`);
  }
  const data=await res.json();
  if(data.stop_reason==="refusal") throw new Error("이 요청은 처리할 수 없다는 답이 왔어요.");
  if(data.stop_reason==="max_tokens") throw new Error("내용이 길어서 답이 잘렸어요. 조금 줄여서 다시 해주세요.");
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  if(!text.trim()) throw new Error("답이 비어서 왔어요. 다시 한 번 눌러주세요.");
  try{ return JSON.parse(text); }catch(e){ return JSON.parse(text.replace(/```json|```/g,"").trim()); }
}

async function callClaude(settings, blocks, selfPerception){
  const parts=blocks.map((b,i)=>`--- ${b.kind==="thread"?`스레드 ${i+1}`:`채널 대화 ${i+1}`} ---\n${b.text}`);
  let userPrompt=`다음은 내 Slack 대화입니다.\n\n${parts.join("\n\n")}`;
  if(selfPerception) userPrompt+=`\n\n내가 생각하는 이 기간의 주요 업무: ${selfPerception}`;
  return postClaude(settings, buildSystemPrompt(settings), userPrompt, OUTPUT_SCHEMA, 20000);
}

const CAREER_CONTEXT_MAX_PERIODS=12; // 기간이 쌓일수록 매 생성마다 보내는 토큰(=비용)이 무한히 늘지 않도록 최근 것만 쓴다.

function buildCareerContext(entries, goal, materials){
  const capped=entries.slice(-CAREER_CONTEXT_MAX_PERIODS);
  const lines=capped.map(e=>{
    const pos=(e.insights||[]).filter(i=>i.polarity==="positive").map(i=>i.text);
    return `[${entryLabel(e)}] ${e.narrative||""}\n강점 신호: ${pos.join(" / ")||"없음"}`;
  });
  const matBlock=(materials&&materials.length)
    ? `\n\n사용자가 직접 추가한 참고 자료 (Slack 로그로 안 잡히는 것):\n${
        materials.map(m=>`[${m.title}]\n${m.content}`).join("\n\n")}`
    : "";
  const periodNote=entries.length>capped.length?`최근 ${capped.length}개 기간, 전체 ${entries.length}개 중`:`${capped.length}개 기간`;
  return (goal?`사용자가 밝힌 목표: ${goal}\n\n`:"")+
    `누적된 협업 기록 (${periodNote}):\n${lines.join("\n\n")}${matBlock}`;
}

/* "부족한 점을 어떻게 극복했는지" 류 질문의 재료 — 검증된(자기보고 아닌) 변화 시도만 쓴다. */
function buildGrowthContext(){
  const verified=getCommitments().filter(c=>c.verdict);
  if(!verified.length) return null;
  const lines=verified.map(c=>{
    const outcome=c.verdict==="changed"?"실제로 바뀜":c.verdict==="partial"?"부분적으로 바뀜":"아직 그대로";
    return `[다짐] ${c.title} — ${c.description}\n[확인 결과: ${outcome}] ${c.verifyNote||""}`;
  });
  return `검증된 행동 변화 시도 목록 (자기보고가 아니라 이후 기록과 대조해서 확인한 것):\n${lines.join("\n\n")}`;
}

async function generateCareerDoc(kind, extra){
  const settings=getSettings(), entries=getEntries();
  if(kind==="growth" && !buildGrowthContext())
    throw new Error("아직 검증된 다짐이 없어요. '해볼 것'에서 다짐을 진행하고, 다음 기간을 분석하면 자동으로 확인됩니다.");
  const ctx=buildCareerContext(entries, settings.careerGoal, getCareerMaterials());
  const growthBlock=kind==="growth"?`\n\n${buildGrowthContext()}`:"";
  let ask="";
  if(kind==="resume") ask=`이력서에 쓸 성과 항목을 3~5개, STAR(상황-과제-행동-결과) 형식으로 한 줄씩 뽑아주세요. content에는 항목마다 줄바꿈으로 구분해 적어주세요.`;
  if(kind==="cover") ask=`아래 회사의 자기소개서 문항에 대한 답변 초안을 800자 내외로 써주세요.\n회사: ${extra.company||"(미입력)"}\n문항: ${extra.question}`;
  if(kind==="interview") ask=`다음 예상 면접 질문에 대한 답변 초안을 실제 사례를 근거로 300자 내외로 써주세요.\n질문: ${extra.question||"협업할 때 본인의 강점은 무엇인가요?"}`;
  if(kind==="growth") ask=`"부족한 점을 어떻게 극복했는지" 같은 질문에 답할 성장 서사를 400자 내외로 써주세요. 위 검증된 행동 변화 시도 목록만 근거로 쓰세요.
    실제로 바뀐 건 확실하게 쓰고, 부분적이거나 아직인 건 "지금도 시도하고 있다"처럼 진행형으로 정직하게 쓰세요. 검증 안 된 극복 서사를 지어내지 마세요.`;
  const userPrompt=`${ctx}${growthBlock}\n\n요청: ${ask}\n\ntitle에는 문서 제목을, highlights에는 이번 초안에 실제로 사용한 근거를 짧은 문장 2~4개로(추상화된 문장으로, 원문 인용 금지) 넣어주세요.`;
  return postClaude(settings, careerDocSystemPrompt(), userPrompt, CAREER_DOC_SCHEMA, 3000);
}

   이력서·면접(기본 질문)·성장서사는 회사·문항 같은 입력이 필요 없어서
   자동화 대상이지만, 자소서는 회사·문항이 있어야 의미가 있어 요청형으로 남긴다.
   ============================================================ */

const DEFAULT_DOC_ID={ resume:"default-resume", interview:"default-interview", growth:"default-growth" };
let generatingDefaults=new Set();

async function autoGenerateDefaultDoc(kind){
  const settings=getSettings();
  if(!settings.apiKey) return;
  if(kind==="growth" && !buildGrowthContext()) return; // 재료 없으면 조용히 건너뜀
  generatingDefaults.add(kind); render();
  try{
    const doc=await generateCareerDoc(kind, {});
    const docs=getCareerDocs(); const id=DEFAULT_DOC_ID[kind];
    let d=docs.find(x=>x.id===id);
    if(d){ d.title=doc.title; d.content=doc.content; d.highlights=doc.highlights||[];
      d.updatedAt=new Date().toISOString(); delete d.editedAt; }
    else docs.push({ id, kind, title:doc.title, content:doc.content, highlights:doc.highlights||[],
      isDefault:true, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() });
    setCareerDocs(docs);
  }catch(e){ /* 조용히 실패 — 카드에서 "지금 만들어보기"로 다시 시도 가능 */ }
  generatingDefaults.delete(kind); render();
}
function autoGenerateDefaultDocs(){ ["resume","interview","growth"].forEach(k=>autoGenerateDefaultDoc(k)); }

const VERIFY_SCHEMA = {
  type:"object",
  properties:{ verdict:{ type:"string", enum:["changed","partial","not_yet"] }, note:{ type:"string" } },
  required:["verdict","note"], additionalProperties:false
};
const VERDICT_LABEL={ changed:"실제로 바뀜", partial:"조금 바뀜", not_yet:"아직 그대로" };

let verifyingIds=new Set();

async function verifyCommitment(id){
  const settings=getSettings();
  const cms=getCommitments(); const c=cms.find(x=>x.id===id); if(!c) return;
  if(!settings.apiKey){ c.verifyNote="API 키가 있어야 확인할 수 있어요."; setCommitments(cms); render(); return; }
  const after=getEntries().filter(e=>new Date(e.periodEnd||e.date) > new Date(c.createdAt));
  if(!after.length){
    c.verifyNote="아직 그 다짐 이후 기간 기록이 없어요. 새 기간을 분석하면 확인할 수 있어요.";
    setCommitments(cms); render(); return;
  }
  verifyingIds.add(id); render();
  const ctx=after.map(e=>`[${entryLabel(e)}] ${e.narrative||""}\n${(e.insights||[]).map(i=>`- (${i.polarity}) ${i.text}`).join("\n")}`).join("\n\n");
  const goal=settings.careerGoal?`\n장기 목표: ${settings.careerGoal}`:"";
  const userPrompt=`사용자가 이런 다짐을 했습니다: "${c.title} — ${c.description}"${goal}\n\n다짐 이후 쌓인 협업 기록:\n${ctx}\n\n이 다짐과 관련된 행동이 실제로 바뀌었는지 위 기록의 근거로만 판단하세요. 과장하지 말고, 근거가 부족하면 not_yet으로 판정하세요. note는 2~3문장으로, 왜 그렇게 판단했는지 구체적 근거를 담아 써주세요.`;
  try{
    const r=await postClaude(settings,
      "당신은 사용자가 스스로 세운 행동 다짐이 실제 업무 기록에서 확인되는지 판정하는 코치입니다. 냉정하고 정직하게 판단하세요.",
      userPrompt, VERIFY_SCHEMA, 1000);
    const cms2=getCommitments(); const c2=cms2.find(x=>x.id===id);
    if(c2){ c2.verdict=r.verdict; c2.verifyNote=r.note; c2.verifiedAt=new Date().toISOString(); c2.verifySeen=false; setCommitments(cms2); }
  }catch(e){
    const cms2=getCommitments(); const c2=cms2.find(x=>x.id===id);
    if(c2){ c2.verifyNote=e.message||"확인하다 문제가 생겼어요."; setCommitments(cms2); }
  }
  verifyingIds.delete(id); render();
}

function persistAnalysis(p, selfPerception){
  const entryId=uid(), now=new Date().toISOString();
  const entries=load(KEY_ENTRIES,[]);
  entries.push({ id:entryId, date:now,
    periodStart:p.periodStart||"", periodEnd:p.periodEnd||"", periodLabel:p.periodLabel||"",
    type:p.type, typeReason:p.typeReason, load:p.load,
    scores:p.scores, benchmark:p.benchmark||null, benchmarkBasis:p.benchmarkBasis||"",
    scoreBreakdown:p.scoreBreakdown||null, evidence:p.evidence||[],
    insights:p.insights||[], improvements:p.improvements||[], activity:p.activity||[],
    workMode:p.workMode, hasTimestamps:p.hasTimestamps,
    narrative:p.narrative, whyThisMatters:p.whyThisMatters,
    selfPerception:selfPerception||"", selfPerceptionNote:p.selfPerceptionNote||"",
    colleagueMentions:(p.colleagues||[]).map(c=>c.name) });
  setEntries(entries);

  // Commitment는 Entry에 종속시키지 않고 별도 테이블로 관리 (마감 기준 추적)
  const cms=getCommitments();
  for(const c of (p.commitments||[]))
    cms.push({ id:uid(), entryId, source:c.source, title:c.title, description:c.description,
      scriptLine:c.scriptLine||"",
      status:"proposed", deadline:c.deadline||null, relatedColleague:c.relatedColleague||null,
      createdAt:now, completedAt:null });
  setCommitments(cms);

  const cols=getColleagues();
  for(const c of (p.colleagues||[])){
    let q=cols.find(z=>z.name===c.name);
    if(!q){ q={name:c.name,interactionCount:0,lastInteraction:now,observedPatterns:[]}; cols.push(q); }
    q.interactionCount+=1; q.lastInteraction=p.periodEnd||now;
    for(const s of (c.patterns||[])) if(!q.observedPatterns.includes(s)) q.observedPatterns.push(s);
    q.observedPatterns=q.observedPatterns.slice(-6);
  }
  setColleagues(cols);
  evaluateTrophies();
  autoVerifyOpenCommitments();
  autoGenerateDefaultDocs();

/* 새 기간이 들어올 때마다, 아직 "확실히 바뀜"으로 확정 안 된 열린 다짐을
   자동으로 대조한다. 사용자가 링크를 기억해서 눌러야 하는 구조를 없앤다. */
function autoVerifyOpenCommitments(){
  const cms=getCommitments();
  const targets=cms.filter(c=>["accepted","observing"].includes(c.status) && c.verdict!=="changed").slice(0,3);
  targets.forEach(c=>verifyCommitment(c.id));
}
const unseenVerifications=()=>getCommitments().filter(c=>c.verdict && c.verifySeen===false);
function markVerifySeen(){
  const cms=getCommitments(); cms.forEach(c=>{ if(c.verdict) c.verifySeen=true; }); setCommitments(cms); render();
}
/* 검증이 연달아 "실제로 바뀜"으로 확정된 횟수 — 꾸준함을 눈에 보이게 한다. */
function verifyStreak(){
  const verified=getCommitments().filter(c=>c.verdict)
    .sort((a,b)=>new Date(a.verifiedAt||0)-new Date(b.verifiedAt||0));
  let streak=0;
  for(let i=verified.length-1;i>=0;i--){
    if(verified[i].verdict==="changed") streak++; else break;
  }
  return streak;
}

let pendingConfirm=null;
function askConfirm(message, onYes){
  pendingConfirm=onYes;
  modal={ title:"확인", subtitle:"", html:`<p class="intro-d">${esc(message)}</p>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-primary btn-sm" onclick="resolveConfirm(true)">네, 진행할게요</button>
      <button class="btn btn-sm" onclick="resolveConfirm(false)">취소</button>
    </div>` };
  render();
}
function resolveConfirm(yes){
  const cb=pendingConfirm; pendingConfirm=null; modal=null;
  if(yes && cb) cb();
  render();
}

  const e=getEntries()[entryIdx]; if(!e) return;
  const bd=e.scoreBreakdown?.[metricKey]||[];
  modal={ title:"원인분석",

      bd.map(p=>`${esc(p.name)} ${p.value}점`).join(" | ")||METRICS[metricKey].formula}`,

function addBlock(k){ syncBlocks(); pasteBlocks.push({kind:k,text:""}); render(); }
function removeBlock(i){ syncBlocks(); pasteBlocks.splice(i,1);
  if(!pasteBlocks.length) pasteBlocks=[{kind:"channel",text:""}]; render(); }
function syncBlocks(){ document.querySelectorAll('textarea[data-block]').forEach(el=>{
  const i=Number(el.dataset.block); if(pasteBlocks[i]) pasteBlocks[i].text=el.value; }); }

async function runAnalysis(){
  syncBlocks();
  const settings=getSettings();
  const sp=(document.getElementById('selfPerception')?.value||"").trim();
  selfPerceptionDraft=sp;
  const filled=pasteBlocks.filter(b=>b.text.trim().length>0);
  if(filled.reduce((n,b)=>n+b.text.trim().length,0)<40){
    errorMsg="너무 짧아요. 조금만 더 붙여넣어 주세요."; return render(); }
  busy=true; errorMsg=""; render();
  try{
    persistAnalysis(await callClaude(settings,filled,sp), sp);
    pasteBlocks=[{kind:"channel",text:""}]; selfPerceptionDraft=""; busy=false; go('home');
  }catch(e){ busy=false; errorMsg=e.message||"분석하다 문제가 생겼어요."; render(); }
}

    let due="";
    if(c.deadline){ const d=daysUntil(c.deadline);
      due=`<span class="badge ${d<=1?"badge-due":""}">${d<0?`${Math.abs(d)}일 지남`:d===0?"오늘까지":`${d}일 남음`}</span>`; }
    const who=c.relatedColleague?`<span class="badge">${esc(c.relatedColleague)}</span>`:"";
    const script=c.scriptLine?`<div class="msg" style="display:flex;align-items:center;gap:8px;justify-content:space-between">
      <span class="msg-text" style="flex:1">${esc(c.scriptLine)}</span>
      <button class="btn btn-sm" style="flex:0 0 auto" data-script="${esc(c.scriptLine)}" onclick="copyScriptLine(this)">복사</button></div>`:"";
    const act=c.status==="proposed"
      ? `<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="setCommitmentStatus('${c.id}','accepted')">해볼게요</button>
         <button class="btn btn-sm" onclick="setCommitmentStatus('${c.id}','observing')">그냥 지켜볼래요</button></div>`
      : `<div class="cmt-status">${c.status==="accepted"?"✓ 해보기로 했어요":"✓ 이번엔 그냥 지켜보기로 했어요"}</div>
         <div class="btn-row" style="margin-top:9px;">
           <button class="btn btn-sm" onclick="setCommitmentStatus('${c.id}','done')">완료</button>
           <button class="btn btn-sm" onclick="setCommitmentStatus('${c.id}','missed')">못 했어요</button></div>
         ${renderVerifyBlock(c)}`;
    return `<div class="cmt"><div class="cmt-head">${badge}${due}${who}</div>
      <p class="cmt-title">${esc(c.title)}</p><p class="cmt-desc">${esc(c.description)}</p>${script}${act}</div>`;

function copyScriptLine(btn){
  const text=btn.dataset.script||"";
  const done=ok=>{ const orig=btn.textContent; btn.textContent=ok?"복사됨 ✓":"복사 실패";
    setTimeout(()=>{ btn.textContent=orig; }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>done(false));
    return;
  }
  // Chrome은 file://에서 Clipboard API 자체를 노출 안 한다(localStorage와 같은 이유).
  // 구식 execCommand로 폴백한다.
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    done(ok);
  }catch(e){ done(false); }
}

/* ============================================================
   나의 강점·약점 — 전 기간 평균으로 본 지표별 요약 (API 호출 없이 계산)
   ============================================================ */

function repEvidenceNote(entries, metric, polarity){
  for(let i=entries.length-1;i>=0;i--){
    const ev=(entries[i].evidence||[]).find(e=>e.metric===metric && e.polarity===polarity);
    if(ev) return ev.note||ev.quote||null;
  }
  return null;
}
function computeStrengthsWeaknesses(entries){
  if(!entries.length) return null;
  const avg={};
  METRIC_KEYS.forEach(k=>{
    const vals=entries.map(e=>e.scores?.[k]).filter(v=>v!=null);
    avg[k]=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
  });
  const ranked=METRIC_KEYS.filter(k=>avg[k]!=null).map(k=>({k,avg:avg[k]})).sort((a,b)=>b.avg-a.avg);
  const recent=entries.slice(-3);
  const chronic=METRIC_KEYS.filter(k=>recent.length>=2 && recent.every(e=>(e.scores?.[k]??100)<60));
  return { avg, strengths:ranked.slice(0,2), weaknesses:ranked.slice(-2).reverse(), chronic };
}
/* 강점·약점 카드는 커리어 탭 안에 있어서, 거기까지 안 들어가는 사람에게는
   반복되는 약점 신호가 안 보였다. 홈에도 짧게 띄운다. */
function renderChronicWeaknessBanner(entries){
  const sw=computeStrengthsWeaknesses(entries);
  if(!sw||!sw.chronic.length) return "";
  return `<div class="stale-banner">${sw.chronic.map(k=>METRICS[k].label).join(", ")}가 최근 계속 낮아요.
    <button class="link" onclick="go('career')">자세히 보기 →</button></div>`;
}
function renderStrengthsCard(){
  const entries=getEntries();
  const sw=computeStrengthsWeaknesses(entries); if(!sw) return "";
  const row=(k,avg,polarity)=>{
    const note=repEvidenceNote(entries,k,polarity);
    return `<div class="sig"><div class="sig-dot" style="background:${polarity==="positive"?"var(--green)":"var(--red)"}"></div><div>
      <div class="sig-t">${METRICS[k].label} · 평균 ${avg}점</div>
      ${note?`<div class="sig-d">${esc(note)}</div>`:""}</div></div>`;
  };
  return `<div class="card">
    <div class="card-title">나의 강점과 약점</div>
    <p class="card-note" style="margin:-6px 0 14px">지금까지 ${entries.length}개 기간 평균으로 봤습니다. 아래 문서를 만들 때도 이 근거를 참고합니다.</p>
    <div class="subhead">강점</div>${sw.strengths.map(s=>row(s.k,s.avg,"positive")).join("")}
    <div class="subhead" style="margin-top:14px">약점</div>${sw.weaknesses.map(w=>row(w.k,w.avg,"negative")).join("")}
    ${sw.chronic.length?`<div class="stale-banner" style="margin-top:14px;text-align:left">
      ${sw.chronic.map(k=>METRICS[k].label).join(", ")}는 최근 기간에도 계속 낮습니다. 아래 "해볼 것"에서 다짐을 만들어보는 게 좋겠어요.</div>`:""}
    <div class="card-note" style="margin-top:10px">지표를 자세히 보려면 <button class="link" onclick="go('trend')">추이 탭</button>에서 눌러보세요.</div>

let materialError="", matTitleDraft="", matContentDraft="";

function addCareerMaterial(){
  const title=(document.getElementById('matTitle')?.value||"").trim();
  const pasted=(document.getElementById('matContent')?.value||"").trim();
  const file=document.getElementById('matFile')?.files?.[0];
  matTitleDraft=title; matContentDraft=pasted;
  const finish=(content)=>{
    if(!content){ materialError="추가할 내용을 입력하거나 파일을 선택해주세요."; return render(); }
    const list=getCareerMaterials();
    list.push({ id:uid(), title:title||(file?file.name:"제목 없음"), content:content.slice(0,8000), createdAt:new Date().toISOString() });
    setCareerMaterials(list); materialError=""; matTitleDraft=""; matContentDraft=""; render();
  };
  if(file){
    const reader=new FileReader();
    reader.onload=()=>finish(String(reader.result||""));
    reader.onerror=()=>{ materialError="파일을 읽지 못했어요. 텍스트로 붙여넣어 주세요."; render(); };
    reader.readAsText(file);
  } else finish(pasted);
}

  setCareerMaterials(getCareerMaterials().filter(m=>m.id!==id)); render();

/* ============================================================
   커리어 문서 랩 — 근거 기반 이력서·자소서·면접 답변 초안 생성 (실제 동작)
   ============================================================ */

let careerDocType="cover", careerBusy=false, careerError="", editingDocId=null;
let careerCompanyDraft="", careerQuestionDraft="";

function setCareerDocType(k){
  careerDocType=k; careerError=""; careerCompanyDraft=""; careerQuestionDraft=""; render();
}

async function runCareerDoc(){
  const company=(document.getElementById('careerCompany')?.value||"").trim();
  const question=(document.getElementById('careerQuestion')?.value||"").trim();
  careerCompanyDraft=company; careerQuestionDraft=question;
  if(careerDocType==="cover" && !question){ careerError="자소서 문항을 입력해주세요."; return render(); }
  if(careerDocType==="growth" && !buildGrowthContext()){
    careerError="아직 검증된 다짐이 없어요. 먼저 '해볼 것'에서 다짐을 진행해보세요."; return render();
  }
  careerBusy=true; careerError=""; render();
  try{
    const doc=await generateCareerDoc(careerDocType,{company,question});
    const docs=getCareerDocs();
    docs.push({ id:uid(), kind:careerDocType, title:doc.title, content:doc.content,
      highlights:doc.highlights||[], company, question, createdAt:new Date().toISOString() });
    careerCompanyDraft=""; careerQuestionDraft="";
    setCareerDocs(docs);
    careerBusy=false; render();
  }catch(e){ careerBusy=false; careerError=e.message||"만들다 문제가 생겼어요."; render(); }
}
function careerDocModalBody(doc){
  if(editingDocId===doc.id) return `<textarea id="docEditArea" style="min-height:220px">${esc(doc.content)}</textarea>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn btn-primary btn-sm" onclick="saveCareerDocEdit('${doc.id}')">저장</button>
        <button class="btn btn-sm" onclick="cancelCareerDocEdit('${doc.id}')">취소</button></div>`;
  if(regeneratingDocId===doc.id) return `<p class="intro-d" style="white-space:pre-wrap">${esc(doc.content)}</p>
      <div class="loading" style="margin-top:12px"><div class="spinner"></div>자료함 반영해서 다시 만드는 중이에요</div>`;
  const materials=getCareerMaterials();
  return `<p class="intro-d" style="white-space:pre-wrap">${esc(doc.content)}</p>
      ${doc.highlights?.length?`<div class="subhead" style="margin-top:14px">사용한 근거</div>
        ${doc.highlights.map(h=>`<div class="kv"><span class="kv-k">${esc(h)}</span></div>`).join("")}`:""}
      <div class="card-note" style="margin-top:12px">Slack 원문은 그대로 쓰지 않고 역량 서술로 바꿔 넣었습니다. 제출 전 꼭 본인이 검토·수정하세요.
        ${doc.editedAt?" 직접 수정한 버전입니다.":""}${doc.regeneratedAt?" 자료함 반영해서 다시 만든 버전입니다.":""}</div>
      ${regenError?`<div class="error-box" style="margin-top:10px">${esc(regenError)}</div>`:""}
      <div class="btn-row" style="margin-top:14px">
        <button class="btn btn-sm" onclick="startCareerDocEdit('${doc.id}')">수정</button>
        <button class="btn btn-sm" onclick="downloadCareerDoc('${doc.id}')">다운로드</button>
      </div>
      ${materials.length?`<div style="margin-top:10px"><button class="link" onclick="regenerateCareerDoc('${doc.id}')">자료함(${materials.length}개) 반영해서 다시 만들기 →</button></div>`:""}`;
}
let regeneratingDocId=null, regenError="";
function regenerateCareerDoc(id){
  const doc=getCareerDocs().find(d=>d.id===id); if(!doc) return;
  if(doc.editedAt) askConfirm("직접 수정한 내용이 있어요. 자료를 반영해 새로 만들면 그 수정 내용은 사라집니다. 계속할까요?",
    ()=>doRegenerateCareerDoc(id));
  else doRegenerateCareerDoc(id);
}
async function doRegenerateCareerDoc(id){
  const doc=getCareerDocs().find(d=>d.id===id); if(!doc) return;
  regeneratingDocId=id; regenError="";
  modal={ title:doc.title, subtitle:`${DOC_TYPES[doc.kind]?.label||doc.kind} · ${fmtTick(doc.createdAt)}`, html:careerDocModalBody(doc) };
  render();
  try{
    const fresh=await generateCareerDoc(doc.kind,{company:doc.company,question:doc.question});
    const docs=getCareerDocs(); const d2=docs.find(x=>x.id===id);
    if(d2){ d2.title=fresh.title; d2.content=fresh.content; d2.highlights=fresh.highlights||[];
      delete d2.editedAt; d2.regeneratedAt=new Date().toISOString(); setCareerDocs(docs); }
    regeneratingDocId=null;
    const updated=getCareerDocs().find(x=>x.id===id);
    modal={ title:updated.title, subtitle:`${DOC_TYPES[updated.kind]?.label||updated.kind} · ${fmtTick(updated.createdAt)}`, html:careerDocModalBody(updated) };
    render();
  }catch(e){
    regeneratingDocId=null; regenError=e.message||"다시 만들다 문제가 생겼어요.";
    const cur=getCareerDocs().find(x=>x.id===id);
    if(cur) modal={ title:cur.title, subtitle:`${DOC_TYPES[cur.kind]?.label||cur.kind} · ${fmtTick(cur.createdAt)}`, html:careerDocModalBody(cur) };
    render();
  }
}
function openCareerDoc(id){
  editingDocId=null;
  const doc=getCareerDocs().find(d=>d.id===id); if(!doc) return;
  modal={ title:doc.title, subtitle:`${DOC_TYPES[doc.kind]?.label||doc.kind} · ${fmtTick(doc.createdAt)}`, html:careerDocModalBody(doc) };
  render();
}
function startCareerDocEdit(id){
  editingDocId=id;
  const doc=getCareerDocs().find(d=>d.id===id); if(!doc) return;
  modal={ ...modal, html:careerDocModalBody(doc) }; render();
}
function cancelCareerDocEdit(id){
  editingDocId=null;
  const doc=getCareerDocs().find(d=>d.id===id); if(!doc) return;
  modal={ ...modal, html:careerDocModalBody(doc) }; render();
}
function saveCareerDocEdit(id){
  const val=document.getElementById('docEditArea')?.value ?? "";
  const list=getCareerDocs(); const doc=list.find(d=>d.id===id);
  if(!doc) return;
  doc.content=val; doc.editedAt=new Date().toISOString();
  setCareerDocs(list); editingDocId=null;
  modal={ ...modal, html:careerDocModalBody(doc) }; render();
}
function downloadCareerDoc(id){
  const doc=getCareerDocs().find(d=>d.id===id); if(!doc) return;
  const blob=new Blob([doc.content], {type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`${(doc.title||"초안").replace(/[\\/:*?"<>|]/g,"")}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function deleteCareerDoc(id){
  askConfirm("이 초안을 지울까요?", ()=>{ setCareerDocs(getCareerDocs().filter(d=>d.id!==id)); render(); });
}

      <div class="loading"><div class="spinner"></div>근거를 정리하는 중이에요</div></div>`;

    <div class="dex">${TYPE_CODES.map(c=>{
      const has=!!owned[c];
      return has
        ? `<div class="dex-cell" onclick="openTypeInfo('${c}')">${avatarHTML(c,"a-sm")}
            <div class="dex-name">${esc(TYPES[c].n)}</div><div class="dex-code">${c} · ${owned[c]}회</div></div>`
        : `<div class="dex-cell locked" onclick="openTypeInfo('${c}')"><div class="dex-lock">?</div>
            <div class="dex-name" style="color:var(--text-low)">${esc(TYPES[c].n)}</div><div class="dex-code">${c}</div></div>`;
    }).join("")}</div>
    ${rep?`<div class="rep-row">${avatarHTML(rep,"a-md")}
      <div class="rep-text"><b>요즘의 나</b><br>${TYPES[rep].e} <b>${esc(TYPES[rep].n)}</b> · ${rep}</div></div>`:""}
    <div class="card-note">일한 양, 협업 점수, 주로 한 일 — 이 셋이 유형을 정합니다. 칸을 눌러보세요.</div>
  </div>`;
}

function renderTrophies(){
  const store=getTrophyStore();
  const byId=Object.fromEntries(store.earned.map(t=>[t.id,t]));
  const got=store.earned.length;
  const row=r=>{
    const t=byId[r.id];
    if(!t) return `<div class="trophy locked"><div class="tr-icon">${r.e}</div>
      <div><div class="tr-name">${esc(r.n)}</div><div class="tr-desc">${esc(r.d)}</div></div></div>`;
    return `<div class="trophy"><div class="tr-icon">${r.e}</div>
      <div><div class="tr-name">${esc(r.n)}
        ${t.retro?`<span class="tag-retro">지난 기록에서 찾음</span>`:""}
        ${!t.seen&&!t.retro?`<span class="tag-new">NEW</span>`:""}</div>
        <div class="tr-desc">${esc(r.d)}</div>
        <div class="tr-when">${t.where?esc(t.where)+" · ":""}${fmtTick(t.earnedAt)} 획득</div></div></div>`;
  };
  const earned=TROPHY_RULES.filter(r=>byId[r.id]), locked=TROPHY_RULES.filter(r=>!byId[r.id]);
  return `<div class="card">
    <div class="card-title">트로피<span style="font-size:13px;color:var(--text-mid)">${got} / ${TROPHY_RULES.length}</span></div>
    <div class="dex-progress"><div class="track"><div class="fill" style="width:${got/TROPHY_RULES.length*100}%"></div></div>
      <span style="font-size:12.5px;color:var(--text-mid);font-weight:600">${Math.round(got/TROPHY_RULES.length*100)}%</span></div>
    ${earned.length?earned.map(row).join(""):`<div class="card-note">아직 받은 트로피가 없습니다.</div>`}
    ${locked.length?`<div class="subhead" style="margin-top:18px">아직 남은 것</div>${locked.map(row).join("")}`:""}
    <div class="card-note">새 트로피가 생기면 지난 기록까지 다시 훑어서 채워드립니다.</div>
  </div>`;
}

function renderRecords(){
  const entries=getEntries().slice().reverse();
  const tabs=`<div class="seg" style="margin-bottom:14px">
    <button class="${recordTab==="periods"?"on":""}" onclick="setRecordTab('periods')">기간별 기록</button>
    <button class="${recordTab==="types"?"on":""}" onclick="setRecordTab('types')">유형 도감</button>
    <button class="${recordTab==="trophies"?"on":""}" onclick="setRecordTab('trophies')">트로피</button></div>`;
  if(recordTab==="types")    return tabs+renderDex();
  if(recordTab==="trophies") return tabs+renderTrophies();

  if(!entries.length) return tabs+`<div class="empty"><h2>아직 비어 있어요</h2><p>분석할 때마다 여기 한 줄씩 쌓입니다.</p></div>`;
  const rows=entries.map(e=>{ const c=typeCode(e);
    return `<div class="hist"><div class="hist-date">${esc(entryLabel(e))}</div>
      <div class="hist-type">${c?`${TYPES[c].e} ${esc(TYPES[c].n)}`:esc(e.type)}</div>
      <div class="track" style="flex:0 0 80px;"><div class="fill" style="width:${avgScore(e.scores)}%"></div></div>
      <div class="hist-score">${avgScore(e.scores)}</div></div>`;}).join("");
  const done=getCommitments().filter(c=>c.status==="done"||c.status==="missed");
  const doneList=done.length?`<div class="card"><div class="card-title">지난 약속</div>
    ${done.map(c=>`<div class="cmt"><div class="cmt-head">
      <span class="badge ${c.source==="self_promise"?"badge-promise":"badge-exp"}">${c.source==="self_promise"?"내 약속":"제안"}</span>
      <span class="badge ${c.status==="done"?"badge-pos":"badge-neg"}">${c.status==="done"?"완료":"미이행"}</span></div>
      <p class="cmt-title">${esc(c.title)}</p></div>`).join("")}</div>`:"";
  return tabs+`<div class="card"><div class="card-title">기간별 기록</div>${rows}</div>${doneList}`;
}

/* ============================================================
   렌더 루트
   ============================================================ */

const TABS=[["home","홈"],["trend","추이"],["colleagues","동료"],["career","커리어"],["records","기록"],["settings","설정"]];

function render(){
  const nv=view==="metric"?"home":view;
  const onboarding=view==="intro"&&!getSettings().onboarded;
  document.getElementById('nav').style.display=onboarding?"none":"flex";
  document.getElementById('nav').innerHTML=TABS
    .map(([k,l])=>`<button class="${nv===k?"active":""}" onclick="go('${k}')">${l}</button>`).join("");
  const entries=getEntries();
  document.getElementById('dateRange').textContent=
    (view==="home"&&entries.length)?entryLabel(entries[entries.length-1]):"";
  const map={ settings:renderSettings, paste:renderPaste, colleagues:renderColleagues,
    records:renderRecords, trend:renderTrend, metric:renderMetric, intro:renderIntro,
    career:renderCareerLab, home:renderHome };
  const warn = (storageOK || warnDismissed) ? "" : `<div class="stale-banner"
    style="text-align:left;display:flex;gap:10px;align-items:center;font-size:12px">
    <span style="flex:1">지금은 기록이 저장되지 않습니다. 창을 닫으면 사라져요.
      <button class="link" onclick="showStorageHelp()">해결 방법</button></span>
    <button class="modal-close" style="font-size:16px" onclick="dismissWarn()">×</button></div>`;
  document.getElementById('content').innerHTML=warn+(map[view]||renderHome)();
  document.getElementById('modalRoot').innerHTML=renderModal();
  attachHandlers();
}

function attachHandlers(){
  const b=document.getElementById('saveSettingsBtn');
  if(b) b.onclick=()=>{ setSettings({ ...getSettings(),
    apiKey:document.getElementById('setApiKey').value.trim(),
    selfName:document.getElementById('setSelfName').value.trim(),
    jobRole:document.getElementById('setJobRole').value,
    careerGoal:document.getElementById('setCareerGoal').value.trim() }); go('home'); };
  const r=document.getElementById('resetBtn');
  if(r) r.onclick=()=>askConfirm('전부 지울까요? 되돌릴 수 없습니다.', ()=>{
    [KEY_ENTRIES,KEY_COMMITMENTS,KEY_COLLEAGUES,KEY_TROPHIES,KEY_CAREER_DOCS,KEY_CAREER_MATERIALS].forEach(k=>{
      try{ localStorage.removeItem(k); }catch(e){} delete memStore[k]; });
    go('home'); });
  const a=document.getElementById('analyzeBtn');
  if(a) a.onclick=runAnalysis;
}

(function init(){
  try{
    const s=getSettings();
    evaluateTrophies();          // 기존 기록에 대해 소급 평가
    if(!s.onboarded) view="intro";
    else if(!s.apiKey||!s.selfName) view="settings";
    render();
  }catch(e){
    // 초기화가 실패해도 빈 화면이 되지 않도록
    document.getElementById('content').innerHTML =
      `<div class="error-box">앱을 시작하지 못했습니다.<br>${esc(e.message||e)}</div>`;
    console.error(e);
  }
})();
</script>
